[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handicap"
version = "0.1.0"
description = "Retrieve a golf handicap from PCCADDIE."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "License.md" }
dependencies = [
    "beautifulsoup4",
    "requests",
]

[project.scripts]
handicap = "handicap:main"

[tool.setuptools]
py-modules = ["handicap"]
